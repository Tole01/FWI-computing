<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mapa de Riesgo 3D - Mapbox</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiamFlZ2VyMjYiLCJhIjoiY21hY3czY2czMDhlYTJ1cTFscGFmZWRwOSJ9.0RQ4Fpfam7S-IFvOZC-qXg'; // ← Reemplaza con tu token

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/satellite-v9',
    center: [-118.25, 34.05],
    zoom: 10,
    pitch: 45,
    bearing: -17.6,
    antialias: true
  });

  map.on('load', () => {
    map.addSource('riesgo', {
      type: 'geojson',
      data: '/riesgo.geojson'
    });

    map.addLayer({
      id: 'riesgo-layer',
      type: 'fill-extrusion',
      source: 'riesgo',
      paint: {
        'fill-extrusion-color': [
          'interpolate', ['linear'], ['get', 'riesgo'],
          0, '#00FF00',
          0.5, '#FFFF00',
          1, '#FF0000'
        ],
        'fill-extrusion-height': [
          'interpolate', ['linear'], ['get', 'riesgo'],
          0, 0,
          1, 200
        ],
        'fill-extrusion-opacity': 0.7
      }
    });
  });
</script>
</body>
</html>
