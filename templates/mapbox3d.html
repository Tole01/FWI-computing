<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mapa de Riesgo 3D - Mapbox</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script>
  // ← Reemplaza con tu token de Mapbox
  mapboxgl.accessToken = 'pk.eyJ1IjoiamFlZ2VyMjYiLCJhIjoiY21hY3czY2czMDhlYTJ1cTFscGFmZWRwOSJ9.0RQ4Fpfam7S-IFvOZC-qXg';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/satellite-v9',
    center: [-99, 19],
    zoom: 10,
    pitch: 45,
    bearing: -17.6,
    antialias: true
  });

  map.on('load', () => {
    map.addSource('riesgo', {
      type: 'geojson',
      data: '/riesgo.geojson'
    });

    map.addLayer({
      id: 'riesgo-layer',
      type: 'fill-extrusion',
      source: 'riesgo',
      paint: {
        'fill-extrusion-color': [
          'interpolate', ['linear'], ['get', 'riesgo'],
          0, '#FFFCC6',
          0.5, '#FDC563',
          1, '#A80024'
        ],
        'fill-extrusion-height': [
          'interpolate', ['linear'], ['get', 'riesgo'],
          0, 0,
          1, 75
        ],
        'fill-extrusion-opacity': 0.5
      }
    });

    fetch('/riesgo.geojson')
    .then(res => res.json())
    .then(data => {
      const bbox = turf.bbox(data); // necesitas turf.js
      map.fitBounds(bbox, { padding: 20, pitch: 45, bearing: -17.6  });
    });
    
  });
</script>
</body>
</html>
