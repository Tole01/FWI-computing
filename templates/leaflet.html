<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mapa de Riesgo 2D - Leaflet</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18
    }).addTo(map);

    fetch('/riesgo.geojson')
      .then(res => res.json())
      .then(data => {
        const geojsonLayer = L.geoJSON(data, {
          style: feature => {
            const riesgo = feature.properties.riesgo;
            const color = riesgo > 0.7 ? '#A80024' : riesgo > 0.4 ? '#FDC563' : '#FFFCC6';
            return { color, fillColor: color, fillOpacity: 0.5 };
          }
        }).addTo(map);

        // Ajustamos el mapa al área del geojson
        map.fitBounds(geojsonLayer.getBounds());
      });
  </script>
</body>
</html>
